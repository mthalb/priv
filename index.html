<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vercel NSFW Player</title>
    <script src="https://cdn.jsdelivr.net/hls.js/latest/hls.js"></script>
    <style>
        body { background: #0f0f0f; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; position: sticky; top: 0; background: #0f0f0f; z-index: 100; padding: 10px 0; }
        input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #333; background: #222; color: white; border-radius: 4px; }
        button { padding: 10px 20px; background: #e50914; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #1a1a1a; border-radius: 8px; overflow: hidden; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .meta { padding: 10px; font-size: 14px; }
        .meta a { color: #e50914; text-decoration: none; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search NSFW...">
    <button onclick="search()">Search</button>
</div>

<div id="grid"></div>

<script>
    async function search() {
        const query = document.getElementById('searchInput').value;
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        if (!query) return;

        try {
            // Call the Vercel Serverless Function
            const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
            const data = await res.json();

            if (!data.videos || data.videos.length === 0) {
                grid.innerHTML = '<p>No results found.</p>';
                return;
            }

            data.videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'card';

                const vidContainer = document.createElement('div');
                vidContainer.className = 'video-container';
                const videoEl = document.createElement('video');
                videoEl.controls = true;
                videoEl.autoplay = true;
                videoEl.muted = true; // Browsers require mute for autoplay

                if (video.type === 'hls' && Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(video.url);
                    hls.attachMedia(videoEl);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        videoEl.play();
                    });
                } else if (video.type === 'mp4') {
                    videoEl.src = video.url;
                    videoEl.play();
                }

                vidContainer.appendChild(videoEl);
                
                card.appendChild(vidContainer);
                
                card.innerHTML += `
                    <div class="meta">
                        <div>${video.title} (${video.duration})</div>
                        <a href="${video.externalLink}" target="_blank">Watch on Source Site</a>
                    </div>
                `;

                grid.appendChild(card);
            });

        } catch (err) {
            console.error(err);
            grid.innerHTML = '<p>Error loading videos.</p>';
        }
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') search();
    });
</script>

</body>
</html>
